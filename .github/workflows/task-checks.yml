name: Task checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    name: Offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: post-forge
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: post-forge/package-lock.json
      - name: Verify runtime pins
        run: |
          test "$(node --version)" = "v24.20.0"
          test "$(npm --version)" = "11.19.0"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Start provider fixture server
        working-directory: post-forge
        env:
          POSTFORGE_PROVIDER_FIXTURES: "1"
          POSTFORGE_PROVIDER_FIXTURE_SERVER: "1"
          POSTFORGE_PROVIDER_FIXTURE_PORT: "8787"
        run: |
          node --import=./tests/fixtures/providers.ts -e 'setInterval(() => {}, 2147483647)' > /tmp/postforge-provider-fixture.log 2>&1 &
          echo $! > /tmp/postforge-provider-fixture.pid
      - name: Start Inngest development runner
        working-directory: post-forge
        env:
          NPM_CONFIG_ALLOW_SCRIPTS: inngest-cli
        run: |
          npx --yes inngest-cli@latest dev -u http://127.0.0.1:3103/api/inngest > /tmp/postforge-inngest.log 2>&1 &
          echo $! > /tmp/postforge-inngest.pid
      - name: Run real generation E2E
        env:
          MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
          TEST_MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
          MONGODB_DB: postforge_test_044_ci
          TEST_MONGODB_DB: postforge_test_044_ci
          POSTFORGE_PROVIDER_FIXTURES: "1"
          POSTFORGE_PROVIDER_FIXTURE_SERVER: "0"
          POSTFORGE_PROVIDER_FIXTURE_PORT: "8787"
          OPENROUTER_BASE_URL: http://127.0.0.1:8787/v1
          OPENROUTER_API_KEY: task044-ci-fixture-key
          OPENROUTER_MODEL: z-ai/glm-5.3-flash
          SERPER_API_KEY: task044-ci-fixture-key
          GEMINI_API_KEY: task044-ci-fixture-key
          IMAGE_PROVIDER: gemini
          IMAGE_MODEL: gemini-2.5-flash-image
          INNGEST_DEV: "true"
          NODE_OPTIONS: --import=./tests/fixtures/providers.ts
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure-evidence
          path: post-forge/test-results/
          if-no-files-found: ignore
          retention-days: 7
