name: Task checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    name: Offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: post-forge
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      POSTFORGE_TEST_MODE: fixture
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: post-forge/package-lock.json
      - name: Verify runtime pins
        run: |
          test "$(node --version)" = "v24.20.0"
          test "$(npm --version)" = "11.19.0"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure-evidence
          path: post-forge/test-results/
          if-no-files-found: ignore
          retention-days: 7
